[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pump-system-analyzer"
version = "0.1.0"
description = "A comprehensive open-source tool for analyzing, comparing, diagnosing, and optimizing pump systems."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Pump System Analyzer Contributors" }
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "plotly>=5.14.0",
    "pyyaml>=6.0",
    "pydantic>=2.4.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pint>=0.22",
    "Jinja2>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy"
]
gui = [
    "streamlit>=1.28.0"
]

[project.scripts]
pump-system = "pump_system_analyzer.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pump_system_analyzer"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
